# .claude/policies/config.yaml
#
# Tunable runtime parameters for Agentic OS v2.
# Edited by the performance_optimizer agent (with user sign-off) or directly by the user.
# Read by agent_selector, execution_engine, and wiki_compiler at every invocation.

version: 1

# Agent selector scoring weights.
# Used by core/agent_selector.py. Must sum to ~1.0 but not strictly enforced.
selector:
  weights:
    semantic:         0.5    # Jaccard over (role + capabilities) tokens vs. task
    success_rate:     0.3    # historical pass-rate from scoring_engine
    cost_efficiency:  0.2    # 1 / (1 + duration_sec + 0.001·tokens)
    pair_trust:       0.1    # bonus when (caller, candidate) has prior trust

  # ε-greedy exploration for cold-start agents (those with n < exploration.min_trials).
  exploration:
    epsilon:      0.10   # probability of picking a random qualifying cold-start agent
    min_trials:   5      # agents with fewer trials are considered cold-start

  # Threshold below which the selector returns None (→ factory handoff).
  no_match_threshold: 0.30

  # v3: epistemic uncertainty classification thresholds (core/uncertainty.py).
  uncertainty_thresholds:
    low:    0.20
    medium: 0.50
    high:   0.80

# v3: adaptive-planning parameters (execution_engine replan checkpoints).
adaptive_planning:
  replan_checkpoint_every: 3    # nodes between replan checks
  replan_threshold:        0.50 # aggregate uncertainty triggering a replan
  max_replans_per_task:    2

# v3: autonomy tier parameters (core/autonomy_controller.py).
autonomy:
  default_tier: 1               # 1=autonomous, 2=notify, 3=approval, 4=amendment
  uncertainty_to_tier:
    low:      1
    medium:   2
    high:     3
    critical: 4
  # Bumps above what uncertainty alone would indicate.
  risk_bumps:
    low:      0
    medium:   1
    high:     2

# Execution engine parameters.
execution:
  retry:
    max_attempts: 2
    backoff_seconds: [1, 2, 4]

  circuit_breaker:
    threshold: 3             # trip after N identical (agent, error_hash) failures
    session_scope: true      # counter resets each session

  simulation:
    detect_cycles: true
    require_all_capabilities_satisfied: true
    max_dag_depth: 5

# Wiki compiler parameters.
wiki_compiler:
  max_entities_per_doc: 25
  summary_sentence_count: 3
  max_related_links: 10

  relationship_extraction:
    enabled: true
    patterns:
      uses:          { confidence: 0.7 }
      extends:       { confidence: 0.8 }
      is_a:          { confidence: 0.7 }
      contradicts:   { confidence: 0.9 }
      related_to:    { confidence: 0.9 }    # explicit [[wiki-link]]
      co_occurs:     { confidence: 0.4 }    # same-section proximity

  # Freshness tracking. Decay job is Phase 2; schema field is live now.
  freshness:
    record_last_updated: true
    decay_enabled: false       # Phase 2
    decay_per_compile: 0.05
    drop_below_confidence: 0.20

# Scoring engine defaults for cold-start agents (no history).
scoring:
  defaults:
    success_rate:   0.7
    duration_ms:    1000
    tokens:         500
  # Laplace smoothing: pass_count_effective = pass_count + alpha
  laplace_alpha: 1.0

# v4: per-task budget allocation (core/budget_manager.py).
budget:
  default_tokens_per_task:        50000
  default_time_seconds_per_task:  600
  hard_caps:
    tokens:        200000
    time_seconds:  1800

# Reflection agent parameters.
reflection:
  # Minimum trials before a strategy is considered reliable enough to influence planning.
  strategy_confidence_threshold: 0.80
  strategy_min_trials: 3
